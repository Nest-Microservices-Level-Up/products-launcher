
services:

  nats-server:
    image: nats:2.10.11-alpine3.19
    ports:
      - "8222:8222"

  client-gateway:
    build: ./client-gateway
    ports:
      - "3000:3000"
    volumes:
      - ./client-gateway/src:/usr/src/app/src
    command: npm run start:dev
    environment:
      - PORT=3000
      - NATS_SERVERS=nats://nats-server:4222

  products-ms:
    build: ./products-ms
    volumes:
      - ./products-ms/src:/usr/src/app/src
    command: npm run start:dev
    environment:
      - PORT=3001
      - NATS_SERVERS=nats://nats-server:4222
      - DATABASE_URL=file:./dev.db

  orders-ms:
    depends_on:
      - orders-db
    build: ./orders-ms
    volumes:
      - ./orders-ms/src:/usr/src/app/src
    command: npm run start:dev
    environment:
      - PORT=3002
      - DATABASE_URL=postgresql://postgres:123456@orders-db:5432/ordersdb?schema=public
      - NATS_SERVERS=nats://nats-server:4222

  auth-ms:
    build: ./auth-ms
    depends_on:
      - auth-db
    volumes:
      - ./auth-ms/src:/usr/src/app/src
    command: npm run start:dev
    environment:
      - PORT=3004
      - NATS_SERVERS=nats://nats-server:4222
      - DATABASE_URL=${AUTH_DATABASE_URL}

  # =======================
  # Payments Microservice
  # =======================

  payments-ms:
    container_name: payments-ms
    build: ./payments-ms
    volumes:
      - ./payments-ms/src:/usr/src/app/src
    command: npm run start:dev
    ports:
      - ${PAYMENTS_MS_PORT}:${PAYMENTS_MS_PORT}
    environment:
      - PORT=${PAYMENTS_MS_PORT}
      - NATS_SERVERS=nats://nats-server:4222
      - PAYMENTS_MS_STRIPE_SECRET=${PAYMENTS_MS_STRIPE_SECRET}
      - PAYMENTS_MS_STRIPE_SUCCESS_URL=${PAYMENTS_MS_STRIPE_SUCCESS_URL}
      - PAYMENTS_MS_STRIPE_CANCEL_URL=${PAYMENTS_MS_STRIPE_CANCEL_URL}
      - PAYMENTS_MS_STRIPE_ENDPOINT_SECRET=${PAYMENTS_MS_STRIPE_ENDPOINT_SECRET}

  orders-db:
    container_name: orders_database
    image: postgres:16
    restart: always
    volumes:
      - orders-db-data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=ordersdb

  auth-db:
    container_name: auth_database
    image: mongo:7.0
    restart: always
    command: ["mongod", "--bind_ip_all", "--replSet", "rs0"]
    volumes:
      - auth-db-data:/data/db
    ports:
      - "27017:27017"

  mongo-init:
    image: mongo:7.0
    depends_on:
      - auth-db
    volumes:
      - ./mongo-init.sh:/mongo-init.sh
    command: sh /mongo-init.sh

volumes:
  orders-db-data:
  auth-db-data:
